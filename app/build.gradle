plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.example.logger"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.logger"
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName "1.9.3"

        // Server backend — de la 1.7.0 platforma e No Zero (noze.ro), nu echo.noze.ro.
        buildConfigField "String", "SERVER_URL", "\"https://noze.ro\""

        // Web Client ID din Google Cloud Console (acelasi proiect Google)
        // Folosit de Credential Manager pentru Sign in with Google
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID",
            "\"784597486644-50hoi1h5rsad4ano9cuf93mf9gtki365.apps.googleusercontent.com\""
    }

    buildFeatures {
        buildConfig true  // necesar pt BuildConfig.VERSION_NAME + GOOGLE_WEB_CLIENT_ID
    }

    // Keystore stabil — APK semnat consistent => upgrade in-place fara dezinstall
    signingConfigs {
        debug {
            storeFile file("bioecho-debug.keystore")
            storePassword "bioecho2026"
            keyAlias "bioecho"
            keyPassword "bioecho2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug  // pentru distribuire APK fără Play Store
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.mlkit:barcode-scanning:17.2.0"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"
    implementation 'org.osmdroid:osmdroid-android:6.1.17'

    // Sign in with Google — Credential Manager (modern API, fara SHA-1 register)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Coroutines pentru apel suspending Credential Manager
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}
