name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write  # necesar pentru a crea GitHub Releases la tag push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK cu versiunea
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = "branch" ] && VERSION="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "bioecho-${VERSION}.apk"
          echo "APK_NAME=bioecho-${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload artifact (build pe branch)
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Create GitHub Release (la tag push v*)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          name: BioEcho ${{ github.ref_name }}
          body: |
            APK Android (debug build) pentru BioEcho.

            **Instalare**:
            1. Descarcă `bioecho-${{ github.ref_name }}.apk`
            2. Pe Android, deschide fișierul descărcat
            3. Permite instalarea din această sursă dacă te întreabă

            Build: `${{ github.sha }}` din branch `${{ github.event.base_ref }}`
