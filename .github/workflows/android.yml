name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write  # necesar pentru a crea GitHub Releases la tag push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle (cu wrapper auto-generate)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK cu versiunea
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = "branch" ] && VERSION="${GITHUB_SHA::7}"
          echo "Looking for APK..."
          find . -name "*.apk" -type f 2>/dev/null
          ls -la app/build/outputs/apk/debug/ 2>&1 || echo "Debug dir missing"
          cp app/build/outputs/apk/debug/app-debug.apk "bioecho-${VERSION}.apk"
          ls -la "bioecho-${VERSION}.apk"
          echo "APK_NAME=bioecho-${VERSION}.apk" >> $GITHUB_ENV

      - name: Upload artifact (build pe branch)
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Create GitHub Release (la tag push v*)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          name: BioEcho ${{ github.ref_name }}
          body: |
            APK Android (debug build) pentru BioEcho.

            **Instalare**:
            1. Descarcă `bioecho-${{ github.ref_name }}.apk`
            2. Pe Android, deschide fișierul descărcat
            3. Permite instalarea din această sursă dacă te întreabă

            Build: `${{ github.sha }}` din branch `${{ github.event.base_ref }}`
